<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>hydration test</title>
    <style>
      body {
        background-color: #ffffff;
        color: #1a1a1a;
        font-family: sans-serif;
        padding: 40px;
        margin: 0;
        min-height: 100vh;
      }
      .card {
        background-color: #f4f4f4;
        color: #333333;
        border: 1px solid #cccccc;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Hydration test page</h1>
    <div class="card" id="card">This card must go dark too.</div>

    <!-- Phase 1: a stylesheet whose <link> is inserted only after load -->
    <script>
      setTimeout(() => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/late-theme.css';
        document.head.appendChild(link);
      }, 1500);

      // Phase 2: hydration swaps adoptedStyleSheets after load (no DOM mutation)
      let sheet2;
      setTimeout(() => {
        sheet2 = new CSSStyleSheet();
        sheet2.replaceSync('#card { background-color: #f0f0f0; color: #222222; }');
        document.adoptedStyleSheets = [sheet2];
      }, 3000);
    </script>
  </body>
</html>
