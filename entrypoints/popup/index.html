<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Force Dark</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>Force Dark</h1>
        <p id="host" class="host">—</p>
      </header>

      <section>
        <div id="modes" class="modes" role="radiogroup" aria-label="Mode for this site">
          <button type="button" data-mode="off" role="radio">Off</button>
          <button type="button" data-mode="auto" role="radio" title="Use the site's own dark theme if it has one, otherwise recolor, otherwise invert">Auto</button>
          <button type="button" data-mode="recolor" role="radio" title="Rewrite the page's colors">Recolor</button>
          <button type="button" data-mode="invert" role="radio" title="Invert everything — works on anything">Invert</button>
        </div>
        <p id="status" class="status">Checking…</p>
        <label class="row images" title="Inverts logos, diagrams and icons that have a light background. Works with Recolor, and with Auto when it recolors. If an image looks wrong, switch this off.">
          <span>Darken light images <em>(experimental)</em></span>
          <input id="images-site" type="checkbox" />
        </label>
        <button id="reset" type="button" class="link" hidden>Use defaults for this site</button>
      </section>

      <section class="defaults">
        <label class="row">
          <span>Default for other sites</span>
          <select id="default-mode">
            <option value="off">Off</option>
            <option value="auto">Auto</option>
            <option value="recolor">Recolor</option>
            <option value="invert">Invert</option>
          </select>
        </label>
        <label class="row">
          <span>Darken light images by default</span>
          <input id="images-default" type="checkbox" />
        </label>
      </section>

      <details id="sites-details" class="sites" hidden>
        <summary>Sites with custom settings (<span id="sites-count">0</span>)</summary>
        <ul id="sites-list"></ul>
      </details>

      <p class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd> toggles this site</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
